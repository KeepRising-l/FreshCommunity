spring:
  datasource:
    url: jdbc:mysql://localhost:3306/freshcommunity_test?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  web:
    resources:
      static-locations: file:${upload.path}/

upload:
  path: ${user.dir}/target/uploads-test

# 测试时关闭 MyBatis 的 SQL 打印，避免刷屏
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
