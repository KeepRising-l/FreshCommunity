server:
  port: 8080

spring:
  application:
    name: freshcommunity-server
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: freshcommunity-secret-key-change-in-production
  expiration: 86400000

# AI 需求解析（OpenAI 兼容接口）。不配置 api-key 时走规则解析，应用正常可用。
ai:
  base-url: ${AI_BASE_URL:https://api.deepseek.com/v1}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:deepseek-chat}
  timeout-seconds: 5

upload:
  path: ${user.dir}/uploads
