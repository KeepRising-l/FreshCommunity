server:
  port: 8080

spring:
  application:
    name: freshcommunity-server
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: freshcommunity-secret-key-change-in-production
  expiration: 86400000

upload:
  path: ${user.dir}/uploads
