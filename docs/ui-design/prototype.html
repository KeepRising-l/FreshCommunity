<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreshCommunity · UI 设计方案（高保真原型）</title>
<style>
/* ============================================================
   FreshCommunity Design System  ·  tokens
   ============================================================ */
:root{
  /* brand */
  --brand:#1E9E5A;
  --brand-600:#178A4E;
  --brand-700:#12713F;
  --brand-100:#D6F0E1;
  --brand-50:#EAF7F0;
  /* accent */
  --accent:#FF7A1A;
  --accent-600:#EE6A08;
  --accent-50:#FFF3E8;
  /* semantic */
  --success:#1E9E5A;
  --warning:#F5A524;
  --danger:#E5484D;
  --danger-50:#FDECEC;
  --info:#3B82F6;
  --info-50:#EAF2FE;
  --warning-50:#FEF6E7;
  /* neutrals (warm-green tinted) */
  --ink-900:#0F1A14;
  --ink-800:#1B2A22;
  --ink-700:#33443B;
  --ink-500:#5B6B62;
  --ink-400:#8A9A91;
  --ink-300:#B7C2BB;
  --line:#E4EAE6;
  --line-soft:#EFF3F0;
  --bg:#F3F7F4;
  --card:#FFFFFF;
  --card-2:#FAFCFA;
  /* radius */
  --r-xl:20px;
  --r-lg:16px;
  --r:12px;
  --r-sm:9px;
  --r-pill:999px;
  /* shadow */
  --sh-1:0 1px 2px rgba(15,26,20,.05), 0 4px 12px rgba(15,26,20,.05);
  --sh-2:0 8px 28px rgba(15,26,20,.10);
  --sh-3:0 16px 48px rgba(15,26,20,.14);
  /* layout */
  --side-w:236px;
  --top-h:64px;
}

*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:#EDF2EE;
  color:var(--ink-700);
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
svg{display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select{font-family:inherit}
s{text-decoration:line-through}

/* ============================================================
   Design-board chrome (outside the app)
   ============================================================ */
.board-head{
  position:sticky;top:0;z-index:50;
  background:rgba(255,255,255,.86);
  backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
}
.board-head-inner{
  max-width:1400px;margin:0 auto;padding:14px 24px;
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
}
.board-brand{display:flex;align-items:center;gap:11px;margin-right:6px}
.board-logo{
  width:36px;height:36px;border-radius:11px;flex:none;
  background:linear-gradient(140deg,#2BB673,#12713F);
  display:grid;place-items:center;color:#fff;font-size:19px;
  box-shadow:0 4px 12px rgba(30,158,90,.32);
}
.board-brand h1{font-size:15px;font-weight:650;color:var(--ink-900);letter-spacing:.2px;line-height:1.2}
.board-brand p{font-size:11.5px;color:var(--ink-400);line-height:1.3}
.board-tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tab-grp{display:flex;align-items:center;gap:4px;padding:4px;border-radius:var(--r-pill);background:var(--bg);border:1px solid var(--line-soft)}
.tab-grp>span{
  font-size:11px;font-weight:600;color:var(--ink-400);padding:0 8px 0 10px;letter-spacing:.5px;
}
.tab{
  padding:6px 13px;border-radius:var(--r-pill);font-size:12.5px;font-weight:500;
  color:var(--ink-500);white-space:nowrap;transition:.16s;
}
.tab:hover{background:#fff;color:var(--ink-800);box-shadow:var(--sh-1)}
.tab.on{background:var(--brand);color:#fff;box-shadow:0 2px 8px rgba(30,158,90,.34)}

.board-stage{
  max-width:1400px;margin:0 auto;padding:26px 24px 80px;
}
.stage-meta{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;padding:0 4px;flex-wrap:wrap}
.stage-meta h2{font-size:19px;font-weight:650;color:var(--ink-900);letter-spacing:.2px}
.stage-meta p{font-size:12.5px;color:var(--ink-400)}
.stage-meta .pill{
  font-size:11px;font-weight:600;padding:3px 10px;border-radius:var(--r-pill);
  background:var(--brand-50);color:var(--brand-700);border:1px solid var(--brand-100);
}

/* browser frame */
.frame{
  background:#fff;border-radius:14px;overflow:hidden;
  box-shadow:var(--sh-3);border:1px solid var(--line);
}
.frame-bar{
  height:38px;background:#F7FAF8;border-bottom:1px solid var(--line-soft);
  display:flex;align-items:center;gap:8px;padding:0 14px;
}
.dot{width:11px;height:11px;border-radius:50%}
.dot.r{background:#FF6058}.dot.y{background:#FFBD2E}.dot.g{background:#28C840}
.urlbar{
  flex:1;max-width:420px;margin-left:10px;height:24px;border-radius:var(--r-pill);
  background:#fff;border:1px solid var(--line);display:flex;align-items:center;gap:7px;
  padding:0 12px;font-size:11.5px;color:var(--ink-400);
}
.frame-body{height:812px;overflow:hidden;position:relative;background:var(--bg)}

/* ============================================================
   App shell
   ============================================================ */
.app{display:flex;height:100%}
.app-side{
  width:var(--side-w);flex:none;background:#fff;border-right:1px solid var(--line);
  display:flex;flex-direction:column;
}
.side-logo{
  height:var(--top-h);display:flex;align-items:center;gap:10px;
  padding:0 18px;border-bottom:1px solid var(--line-soft);flex:none;
}
.side-logo .mark{
  width:32px;height:32px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:linear-gradient(140deg,#2BB673,#12713F);color:#fff;font-size:17px;
  box-shadow:0 3px 10px rgba(30,158,90,.3);
}
.side-logo b{font-size:14.5px;font-weight:650;color:var(--ink-900);letter-spacing:.2px}
.side-logo small{display:block;font-size:10.5px;color:var(--ink-400);font-weight:400;letter-spacing:.4px}
.side-nav{flex:1;overflow-y:auto;padding:14px 12px}
.nav-grp{margin-bottom:16px}
.nav-grp>label{
  display:block;font-size:10.5px;font-weight:700;letter-spacing:1px;
  color:var(--ink-300);padding:0 10px 7px;text-transform:uppercase;
}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;
  font-size:13.5px;color:var(--ink-500);font-weight:500;margin-bottom:2px;
  transition:.15s;position:relative;cursor:pointer;width:100%;text-align:left;
}
.nav-item:hover{background:var(--bg);color:var(--ink-800)}
.nav-item.on{background:var(--brand-50);color:var(--brand-700);font-weight:600}
.nav-item.on::before{
  content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);
  width:3px;height:18px;border-radius:0 3px 3px 0;background:var(--brand);
}
.nav-item svg{width:18px;height:18px;flex:none;opacity:.85}
.nav-item .n-badge{
  margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:var(--danger);color:#fff;font-size:10.5px;font-weight:600;
  display:grid;place-items:center;
}
.side-foot{padding:12px;border-top:1px solid var(--line-soft);flex:none}
.side-user{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:11px;background:var(--card-2);
  border:1px solid var(--line-soft);
}
.avatar{
  width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:linear-gradient(140deg,#7ED0A4,#1E9E5A);color:#fff;font-size:13px;font-weight:600;
}
.side-user b{font-size:12.5px;color:var(--ink-800);font-weight:600;display:block;line-height:1.25}
.side-user small{font-size:10.5px;color:var(--ink-400)}

.app-main{flex:1;display:flex;flex-direction:column;min-width:0}
.app-top{
  height:var(--top-h);flex:none;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:0 24px;
}
.crumb{font-size:13px;color:var(--ink-400);display:flex;align-items:center;gap:7px}
.crumb b{color:var(--ink-900);font-weight:600;font-size:15px}
.top-search{
  margin-left:auto;width:280px;height:38px;border-radius:var(--r-pill);
  background:var(--bg);border:1px solid transparent;display:flex;align-items:center;
  gap:9px;padding:0 15px;font-size:13px;color:var(--ink-400);transition:.18s;
}
.top-search:hover{border-color:var(--line);background:#fff}
.icon-btn{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  color:var(--ink-500);position:relative;transition:.15s;flex:none;
}
.icon-btn:hover{background:var(--bg);color:var(--ink-800)}
.icon-btn .dot-badge{
  position:absolute;top:6px;right:6px;min-width:16px;height:16px;padding:0 4px;
  border-radius:8px;background:var(--danger);color:#fff;font-size:10px;font-weight:600;
  display:grid;place-items:center;border:2px solid #fff;
}
.app-body{flex:1;overflow-y:auto;padding:24px 28px 40px}
.app-body::-webkit-scrollbar,.side-nav::-webkit-scrollbar{width:8px}
.app-body::-webkit-scrollbar-thumb,.side-nav::-webkit-scrollbar-thumb{background:#D8E2DA;border-radius:4px}

/* ============================================================
   Primitives
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:38px;padding:0 17px;border-radius:var(--r-sm);font-size:13.5px;font-weight:600;
  transition:.16s;white-space:nowrap;
}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 2px 8px rgba(30,158,90,.26)}
.btn-primary:hover{background:var(--brand-600);box-shadow:0 4px 14px rgba(30,158,90,.34)}
.btn-accent{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(255,122,26,.3)}
.btn-accent:hover{background:var(--accent-600)}
.btn-ghost{background:#fff;color:var(--ink-700);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--ink-300);background:var(--card-2)}
.btn-soft{background:var(--brand-50);color:var(--brand-700)}
.btn-soft:hover{background:var(--brand-100)}
.btn-sm{height:32px;padding:0 13px;font-size:12.5px;border-radius:8px}
.btn-lg{height:46px;padding:0 24px;font-size:15px;border-radius:11px}
.btn-block{width:100%}
.btn-danger-soft{background:var(--danger-50);color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-1);
}
.card-pad{padding:20px}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sec-head h3{font-size:15.5px;font-weight:650;color:var(--ink-900);letter-spacing:.2px}
.sec-head .more{margin-left:auto;font-size:12.5px;color:var(--ink-400);display:flex;align-items:center;gap:4px;cursor:pointer}
.sec-head .more:hover{color:var(--brand)}

.chip{
  display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 15px;
  border-radius:var(--r-pill);background:#fff;border:1px solid var(--line);
  font-size:13px;color:var(--ink-500);font-weight:500;transition:.15s;cursor:pointer;
}
.chip:hover{border-color:var(--brand-100);color:var(--brand-700);background:var(--brand-50)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(30,158,90,.26)}

.badge{
  display:inline-flex;align-items:center;gap:5px;height:23px;padding:0 10px;
  border-radius:7px;font-size:11.5px;font-weight:600;white-space:nowrap;
}
.badge .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.b-green{background:var(--brand-50);color:var(--brand-700)}
.b-orange{background:var(--accent-50);color:var(--accent-600)}
.b-blue{background:var(--info-50);color:#2563EB}
.b-gray{background:#F1F4F2;color:var(--ink-500)}
.b-red{background:var(--danger-50);color:var(--danger)}
.b-yellow{background:var(--warning-50);color:#B4740C}

.price{color:var(--accent-600);font-weight:750;font-size:20px;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.price i{font-size:12.5px;font-style:normal;font-weight:600;margin-right:1px}
.price s{color:var(--ink-300);font-size:12.5px;font-weight:400;margin-left:7px}

.progress{height:7px;border-radius:var(--r-pill);background:#EDF1EE;overflow:hidden}
.progress .bar{height:100%;border-radius:var(--r-pill);background:linear-gradient(90deg,#4CC98A,#1E9E5A);transition:width .4s}
.progress .bar.hot{background:linear-gradient(90deg,#FFA45C,#FF7A1A)}

.field{display:flex;align-items:center;gap:9px;height:44px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:#fff;padding:0 14px;transition:.16s}
.field:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-50)}
.field input{border:none;outline:none;flex:1;font-size:14px;color:var(--ink-800);background:none;min-width:0}
.field input::placeholder{color:var(--ink-300)}
.field svg{width:17px;height:17px;color:var(--ink-400);flex:none}
.field label{font-size:13px;color:var(--ink-500);font-weight:500}

.muted{color:var(--ink-400);font-size:12.5px;display:flex;align-items:center;gap:5px}
.muted svg{width:14px;height:14px;flex:none;opacity:.8}

.stat{display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:var(--r-lg);
  background:#fff;border:1px solid var(--line);box-shadow:var(--sh-1)}
.stat .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none}
.stat .ic svg{width:21px;height:21px}
.stat .v{font-size:26px;font-weight:750;color:var(--ink-900);letter-spacing:-.6px;line-height:1.15;font-variant-numeric:tabular-nums}
.stat .k{font-size:12.5px;color:var(--ink-400);margin-top:1px}
.stat .trend{margin-left:auto;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:6px}

.table{width:100%;border-collapse:separate;border-spacing:0}
.table th{
  text-align:left;font-size:11.5px;font-weight:700;color:var(--ink-400);letter-spacing:.6px;
  padding:11px 16px;background:var(--card-2);border-bottom:1px solid var(--line);text-transform:uppercase;
}
.table th:first-child{border-radius:var(--r) 0 0 0}
.table th:last-child{border-radius:0 var(--r) 0 0}
.table td{padding:13px 16px;border-bottom:1px solid var(--line-soft);font-size:13.5px;color:var(--ink-700);vertical-align:middle}
.table tbody tr:last-child td{border-bottom:none}
.table tbody tr{transition:.14s}
.table tbody tr:hover{background:var(--card-2)}

.thumb{
  width:44px;height:44px;border-radius:11px;flex:none;display:grid;place-items:center;font-size:21px;
}
.thumb.lg{width:64px;height:64px;font-size:30px;border-radius:14px}

.g1{background:linear-gradient(140deg,#FFE9E0,#FFD3C2)}
.g2{background:linear-gradient(140deg,#FFF6DA,#FFE7A8)}
.g3{background:linear-gradient(140deg,#E4F6E7,#C4EBCE)}
.g4{background:linear-gradient(140deg,#E8F1FF,#CFE1FB)}
.g5{background:linear-gradient(140deg,#FDE9F3,#F9CFE4)}
.g6{background:linear-gradient(140deg,#EDE9FD,#DCD4FA)}

.grid{display:grid;gap:16px}
.g-2{grid-template-columns:repeat(2,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-4{grid-template-columns:repeat(4,1fr)}

/* ============================================================
   Screen: tokens
   ============================================================ */
.tok{max-width:1100px;margin:0 auto;padding:8px 0 20px}
.tok h2{font-size:22px;font-weight:700;color:var(--ink-900);margin-bottom:6px}
.tok .lead{font-size:13.5px;color:var(--ink-400);margin-bottom:28px;max-width:720px;line-height:1.7}
.tok-block{margin-bottom:34px}
.tok-block>h4{font-size:12px;font-weight:700;letter-spacing:1.2px;color:var(--ink-300);
  text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.tok-block>h4::after{content:"";flex:1;height:1px;background:var(--line)}
.sw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
.sw{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#fff}
.sw .fill{height:62px}
.sw .meta{padding:9px 11px}
.sw .meta b{display:block;font-size:12.5px;color:var(--ink-800);font-weight:600}
.sw .meta span{font-size:11px;color:var(--ink-400);font-family:ui-monospace,Menlo,monospace}
.type-row{display:flex;align-items:baseline;gap:18px;padding:11px 0;border-bottom:1px dashed var(--line-soft)}
.type-row .lbl{width:110px;flex:none;font-size:11.5px;color:var(--ink-300);font-family:ui-monospace,Menlo,monospace}
.comp-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:16px;border-radius:var(--r);
  background:var(--card-2);border:1px solid var(--line-soft)}

/* ============================================================
   Screen: auth
   ============================================================ */
.auth{display:flex;height:100%;background:#fff}
.auth-left{
  flex:1.05;position:relative;overflow:hidden;padding:52px 56px;color:#fff;
  background:linear-gradient(150deg,#1E9E5A 0%,#12713F 62%,#0C5530 100%);
  display:flex;flex-direction:column;
}
.auth-left::before{
  content:"";position:absolute;width:520px;height:520px;border-radius:50%;
  right:-190px;top:-160px;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 68%);
}
.auth-left::after{
  content:"";position:absolute;width:360px;height:360px;border-radius:50%;
  left:-130px;bottom:-140px;background:radial-gradient(circle,rgba(255,122,26,.30),transparent 66%);
}
.auth-logo{display:flex;align-items:center;gap:12px;position:relative;z-index:2}
.auth-logo .mark{
  width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.28);display:grid;place-items:center;font-size:21px;backdrop-filter:blur(6px);
}
.auth-logo b{font-size:17px;font-weight:650;letter-spacing:.3px}
.auth-logo small{display:block;font-size:11px;opacity:.72;letter-spacing:.6px}
.auth-copy{position:relative;z-index:2;margin-top:auto;margin-bottom:auto}
.auth-copy h2{font-size:36px;font-weight:750;line-height:1.28;letter-spacing:-.6px;margin-bottom:16px}
.auth-copy h2 em{font-style:normal;color:#FFC48A}
.auth-copy p{font-size:14.5px;opacity:.84;line-height:1.75;max-width:390px}
.auth-feats{display:flex;gap:26px;margin-top:34px;position:relative;z-index:2}
.auth-feat b{display:block;font-size:24px;font-weight:750;letter-spacing:-.5px}
.auth-feat span{font-size:12px;opacity:.75}
.auth-emoji{position:absolute;right:34px;bottom:34px;font-size:0;z-index:2;opacity:.9}
.auth-emoji i{font-style:normal;font-size:38px;display:inline-block;filter:drop-shadow(0 6px 12px rgba(0,0,0,.2))}
.auth-emoji i:nth-child(1){transform:rotate(-8deg)}
.auth-emoji i:nth-child(2){transform:translateY(-14px) rotate(6deg);margin-left:-10px}
.auth-emoji i:nth-child(3){transform:rotate(-4deg);margin-left:-8px}

.auth-right{flex:1;display:grid;place-items:center;padding:40px}
.auth-form{width:100%;max-width:376px}
.auth-form h3{font-size:23px;font-weight:700;color:var(--ink-900);letter-spacing:-.3px}
.auth-form .sub{font-size:13.5px;color:var(--ink-400);margin-top:6px;margin-bottom:26px}
.seg{display:flex;gap:4px;padding:4px;background:var(--bg);border-radius:11px;margin-bottom:24px}
.seg button{
  flex:1;height:36px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink-500);transition:.16s;
}
.seg button.on{background:#fff;color:var(--brand-700);box-shadow:var(--sh-1)}
.fld{margin-bottom:15px}
.fld>label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-700);margin-bottom:7px}
.fld .field{height:46px}
.auth-row{display:flex;align-items:center;justify-content:space-between;margin:18px 0 22px;font-size:12.5px}
.auth-row a{color:var(--brand);font-weight:600;cursor:pointer;text-decoration:none}
.check{display:flex;align-items:center;gap:7px;color:var(--ink-500);cursor:pointer}
.check i{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:10px;color:#fff;font-style:normal;background:#fff}
.check.on i{background:var(--brand);border-color:var(--brand)}
.auth-foot{text-align:center;font-size:13px;color:var(--ink-400);margin-top:22px}
.auth-foot a{color:var(--brand);font-weight:600;cursor:pointer;text-decoration:none}
.role-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}
.role-pick .rp{
  border:1.5px solid var(--line);border-radius:var(--r);padding:12px;text-align:center;transition:.16s;cursor:pointer;background:#fff;
}
.role-pick .rp:hover{border-color:var(--brand-100);background:var(--brand-50)}
.role-pick .rp.on{border-color:var(--brand);background:var(--brand-50);box-shadow:0 0 0 3px var(--brand-50)}
.role-pick .rp b{display:block;font-size:13.5px;color:var(--ink-800);font-weight:650}
.role-pick .rp span{font-size:11.5px;color:var(--ink-400)}
.role-pick .rp .e{font-size:22px;display:block;margin-bottom:5px}
.demo-hint{
  margin-top:22px;padding:12px 14px;border-radius:var(--r);background:var(--card-2);
  border:1px dashed var(--line);font-size:12px;color:var(--ink-500);line-height:1.75;
}
.demo-hint b{color:var(--ink-700)}
.demo-hint code{background:#fff;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11.5px;color:var(--brand-700)}

/* ============================================================
   Screen: user home
   ============================================================ */
.hero{
  border-radius:var(--r-xl);padding:30px 34px;margin-bottom:22px;position:relative;overflow:hidden;
  background:linear-gradient(120deg,#1E9E5A 0%,#178A4E 55%,#0F6B3C 100%);color:#fff;
  display:flex;align-items:center;gap:28px;
}
.hero::before{
  content:"";position:absolute;width:440px;height:440px;border-radius:50%;right:-120px;top:-180px;
  background:radial-gradient(circle,rgba(255,255,255,.14),transparent 68%);
}
.hero::after{
  content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:150px;bottom:-170px;
  background:radial-gradient(circle,rgba(255,122,26,.34),transparent 66%);
}
.hero-l{position:relative;z-index:2;flex:1}
.hero-tag{
  display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;
  background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.26);
  padding:5px 13px;border-radius:var(--r-pill);margin-bottom:15px;backdrop-filter:blur(6px);
}
.hero h2{font-size:27px;font-weight:750;letter-spacing:-.5px;line-height:1.3;margin-bottom:9px}
.hero h2 em{font-style:normal;color:#FFC48A}
.hero p{font-size:13.5px;opacity:.84;margin-bottom:20px}
.hero-btns{display:flex;gap:10px}
.btn-white{background:#fff;color:var(--brand-700)}
.btn-white:hover{background:#F2FBF6}
.btn-outline-w{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.34)}
.btn-outline-w:hover{background:rgba(255,255,255,.2)}
.hero-r{position:relative;z-index:2;display:flex;gap:10px;flex:none}
.hero-stat{
  background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);
  border-radius:var(--r);padding:14px 18px;text-align:center;backdrop-filter:blur(8px);min-width:92px;
}
.hero-stat b{display:block;font-size:23px;font-weight:750;letter-spacing:-.5px}
.hero-stat span{font-size:11.5px;opacity:.8}

.filter-row{display:flex;align-items:center;gap:9px;margin-bottom:18px;flex-wrap:wrap}
.filter-row .spacer{flex:1}
.sort{
  display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-500);
  border:1px solid var(--line);background:#fff;border-radius:var(--r-pill);height:32px;padding:0 13px;
}

.gcard{
  background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;
  box-shadow:var(--sh-1);transition:.2s;display:flex;flex-direction:column;
}
.gcard:hover{transform:translateY(-3px);box-shadow:var(--sh-2);border-color:var(--brand-100)}
.gcard-media{
  height:132px;position:relative;display:grid;place-items:center;font-size:52px;
}
.gcard-media .flag{
  position:absolute;left:12px;top:12px;font-size:11px;font-weight:700;padding:4px 10px;
  border-radius:var(--r-pill);color:#fff;backdrop-filter:blur(4px);
}
.flag-hot{background:linear-gradient(90deg,#FF8A3D,#FF5E1A);box-shadow:0 3px 10px rgba(255,94,26,.34)}
.flag-new{background:linear-gradient(90deg,#38BDF8,#0EA5E9)}
.flag-done{background:rgba(15,26,20,.62)}
.gcard-media .fav{
  position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:50%;
  background:rgba(255,255,255,.86);display:grid;place-items:center;font-size:14px;backdrop-filter:blur(4px);
}
.gcard-body{padding:15px 16px 16px;display:flex;flex-direction:column;flex:1}
.gcard-body h4{font-size:14.5px;font-weight:650;color:var(--ink-900);margin-bottom:6px;line-height:1.4}
.gcard-body .from{margin-bottom:11px}
.price-line{display:flex;align-items:baseline;gap:8px;margin-bottom:13px}
.save-tag{
  font-size:11px;font-weight:700;color:var(--accent-600);background:var(--accent-50);
  padding:2px 7px;border-radius:5px;
}
.prog-meta{display:flex;align-items:center;justify-content:space-between;margin:8px 0 14px;font-size:12px}
.prog-meta b{color:var(--brand-700);font-weight:700}
.cd{display:flex;align-items:center;gap:4px;color:var(--accent-600);font-weight:600;font-size:11.5px}
.cd.urgent{color:var(--danger)}
.cd svg{width:13px;height:13px}
.gcard .btn{margin-top:auto}

/* ============================================================
   Screen: products
   ============================================================ */
.split{display:flex;gap:20px;align-items:flex-start}
.side-filter{width:196px;flex:none;position:sticky;top:0}
.side-filter .card{padding:8px}
.cat{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;font-size:13.5px;
  color:var(--ink-500);font-weight:500;cursor:pointer;transition:.15s;
}
.cat:hover{background:var(--bg);color:var(--ink-800)}
.cat.on{background:var(--brand-50);color:var(--brand-700);font-weight:600}
.cat .cnt{margin-left:auto;font-size:11.5px;color:var(--ink-300)}
.cat.on .cnt{color:var(--brand)}
.pcard{
  background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;
  transition:.2s;box-shadow:var(--sh-1);
}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--sh-2);border-color:var(--brand-100)}
.pcard-media{height:118px;display:grid;place-items:center;font-size:46px;position:relative}
.pcard-body{padding:13px 14px 15px}
.pcard-body h4{font-size:13.5px;font-weight:600;color:var(--ink-900);margin-bottom:7px;line-height:1.4}
.rate{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-400);margin-bottom:9px}
.rate .star{color:#F5A524}
.rate svg{width:13px;height:13px}

/* product detail */
.pd{display:grid;grid-template-columns:400px 1fr;gap:26px}
.pd-gallery{border-radius:var(--r-lg);height:340px;display:grid;place-items:center;font-size:120px;position:relative}
.pd-thumbs{display:flex;gap:10px;margin-top:12px}
.pd-thumbs i{
  width:60px;height:60px;border-radius:11px;display:grid;place-items:center;font-size:26px;font-style:normal;
  border:1.5px solid transparent;cursor:pointer;
}
.pd-thumbs i.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-50)}
.pd-info h2{font-size:22px;font-weight:700;color:var(--ink-900);letter-spacing:-.3px;margin-bottom:10px}
.pd-price-bar{
  display:flex;align-items:baseline;gap:12px;padding:16px 20px;border-radius:var(--r);
  background:linear-gradient(100deg,#FFF3E8,#FFF9F4);border:1px solid #FFE3CB;margin:16px 0;
}
.pd-price-bar .price{font-size:30px}
.kv{display:flex;gap:10px;padding:8px 0;font-size:13px;border-bottom:1px dashed var(--line-soft)}
.kv:last-child{border-bottom:none}
.kv .k{width:76px;flex:none;color:var(--ink-400)}
.kv .v{color:var(--ink-700);font-weight:500}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--r-sm);height:38px;overflow:hidden}
.qty button{width:34px;height:100%;font-size:17px;color:var(--ink-500);background:var(--card-2)}
.qty button:hover{background:var(--bg);color:var(--brand)}
.qty span{width:46px;text-align:center;font-size:14px;font-weight:600;color:var(--ink-800)}

/* review */
.review{padding:15px 0;border-bottom:1px solid var(--line-soft);display:flex;gap:12px}
.review:last-child{border-bottom:none}
.review .body{flex:1;min-width:0}
.review .head{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.review .head b{font-size:13px;color:var(--ink-800);font-weight:600}
.review .head span{font-size:11.5px;color:var(--ink-300)}
.review p{font-size:13px;color:var(--ink-500);line-height:1.65}
.stars{display:flex;gap:1px;color:#F5A524}
.stars svg{width:13px;height:13px}
.stars .off{color:#E2E8E4}

/* ============================================================
   Screen: orders
   ============================================================ */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs button{
  padding:11px 4px;margin-right:22px;font-size:14px;font-weight:600;color:var(--ink-400);
  border-bottom:2px solid transparent;transition:.16s;display:flex;align-items:center;gap:7px;
}
.tabs button:hover{color:var(--ink-700)}
.tabs button.on{color:var(--brand-700);border-bottom-color:var(--brand)}
.tabs button .n{
  font-size:11px;font-weight:700;background:#EDF1EE;color:var(--ink-400);
  padding:1px 7px;border-radius:var(--r-pill);
}
.tabs button.on .n{background:var(--brand-50);color:var(--brand-700)}

.ocard{
  background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-1);margin-bottom:14px;overflow:hidden;
}
.ocard-head{
  display:flex;align-items:center;gap:14px;padding:14px 20px;background:var(--card-2);
  border-bottom:1px solid var(--line-soft);font-size:12.5px;color:var(--ink-400);
}
.ocard-head .no{font-family:ui-monospace,Menlo,monospace;color:var(--ink-500);font-size:12px}
.ocard-head .st{margin-left:auto}
.ocard-main{display:flex;align-items:center;gap:16px;padding:17px 20px}
.ocard-main .info{flex:1;min-width:0}
.ocard-main .info h4{font-size:14.5px;font-weight:650;color:var(--ink-900);margin-bottom:5px}
.ocard-main .amt{text-align:right;flex:none}
.ocard-main .amt b{font-size:17px;font-weight:750;color:var(--ink-900);font-variant-numeric:tabular-nums}
.ocard-main .amt span{display:block;font-size:11.5px;color:var(--ink-400)}
.ocard-foot{
  display:flex;align-items:center;gap:10px;padding:13px 20px;border-top:1px solid var(--line-soft);
}
.ocard-foot .hint{font-size:12.5px;color:var(--ink-400);margin-right:auto}
.ocard-foot .hint b{color:var(--accent-600)}

.pickup{
  margin:0 20px 16px;border-radius:var(--r);padding:16px 18px;
  background:linear-gradient(100deg,#EAF7F0,#F6FCF8);border:1.5px dashed #A9DCBE;
  display:flex;align-items:center;gap:18px;
}
.pickup .code{display:flex;gap:7px}
.pickup .code i{
  width:38px;height:46px;border-radius:9px;background:#fff;border:1px solid var(--brand-100);
  display:grid;place-items:center;font-style:normal;font-size:21px;font-weight:750;
  color:var(--brand-700);font-family:ui-monospace,Menlo,monospace;box-shadow:var(--sh-1);
}
.pickup .txt{flex:1}
.pickup .txt b{display:block;font-size:13.5px;color:var(--ink-800);font-weight:650;margin-bottom:3px}
.pickup .txt span{font-size:12px;color:var(--ink-400)}
.pickup .qr{
  width:58px;height:58px;border-radius:11px;background:#fff;border:1px solid var(--brand-100);
  display:grid;place-items:center;flex:none;
}

.track{display:flex;gap:0;padding:6px 20px 18px}
.track .node{flex:1;position:relative;text-align:center}
.track .node::before{
  content:"";position:absolute;top:8px;left:-50%;width:100%;height:2px;background:var(--line);
}
.track .node:first-child::before{display:none}
.track .node.done::before,.track .node.cur::before{background:var(--brand)}
.track .node .pt{
  width:17px;height:17px;border-radius:50%;background:#fff;border:2px solid var(--line);
  margin:0 auto 7px;position:relative;z-index:2;
}
.track .node.done .pt{background:var(--brand);border-color:var(--brand)}
.track .node.cur .pt{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px var(--brand-50)}
.track .node span{font-size:11.5px;color:var(--ink-400)}
.track .node.done span,.track .node.cur span{color:var(--brand-700);font-weight:600}

/* ============================================================
   Screen: notifications
   ============================================================ */
.msg{
  display:flex;gap:14px;padding:16px 18px;border-radius:var(--r);transition:.15s;
  border:1px solid transparent;cursor:pointer;
}
.msg:hover{background:var(--card-2)}
.msg.unread{background:#F7FCF9;border-color:var(--brand-50)}
.msg .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:19px}
.msg .body{flex:1;min-width:0}
.msg .body .r1{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.msg .body h4{font-size:13.5px;font-weight:650;color:var(--ink-900)}
.msg .body .time{margin-left:auto;font-size:11.5px;color:var(--ink-300);flex:none}
.msg .body p{font-size:13px;color:var(--ink-500);line-height:1.6}
.msg .undot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;margin-top:6px}

/* ============================================================
   Screen: leader
   ============================================================ */
.lgroup{
  background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;
  box-shadow:var(--sh-1);margin-bottom:13px;transition:.18s;
}
.lgroup:hover{border-color:var(--brand-100);box-shadow:var(--sh-2)}
.lgroup .top{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px}
.lgroup .top .info{flex:1;min-width:0}
.lgroup .top h4{font-size:15px;font-weight:650;color:var(--ink-900);margin-bottom:6px}
.lgroup .metrics{display:flex;gap:26px;padding:13px 0 0;border-top:1px dashed var(--line-soft);margin-top:14px}
.lgroup .metrics div{font-size:11.5px;color:var(--ink-400)}
.lgroup .metrics b{display:block;font-size:18px;font-weight:750;color:var(--ink-900);letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.lgroup .metrics b.g{color:var(--brand-700)}
.lgroup .metrics b.o{color:var(--accent-600)}

/* verify */
.verify-wrap{max-width:640px;margin:0 auto}
.code-box{display:flex;gap:12px;justify-content:center;margin:30px 0 26px}
.code-box i{
  width:60px;height:74px;border-radius:14px;background:#fff;border:2px solid var(--line);
  display:grid;place-items:center;font-style:normal;font-size:32px;font-weight:750;
  color:var(--ink-900);font-family:ui-monospace,Menlo,monospace;transition:.18s;
  box-shadow:var(--sh-1);
}
.code-box i.filled{border-color:var(--brand);color:var(--brand-700);background:#F7FCF9}
.code-box i.cur{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-50)}
.scan-hint{
  text-align:center;font-size:12.5px;color:var(--ink-400);display:flex;align-items:center;
  justify-content:center;gap:7px;margin-bottom:24px;
}
.recent-row{
  display:flex;align-items:center;gap:13px;padding:13px 16px;border-radius:var(--r);
  transition:.15s;border-bottom:1px solid var(--line-soft);
}
.recent-row:last-child{border-bottom:none}
.recent-row:hover{background:var(--card-2)}
.recent-row .code-tag{
  font-family:ui-monospace,Menlo,monospace;font-size:13px;font-weight:700;color:var(--brand-700);
  background:var(--brand-50);padding:4px 10px;border-radius:7px;letter-spacing:1px;
}
.recent-row .info{flex:1;min-width:0;font-size:13px}
.recent-row .info b{color:var(--ink-800);font-weight:600}
.recent-row .info span{color:var(--ink-400);font-size:11.5px;display:block}

/* ============================================================
   Screen: admin dashboard
   ============================================================ */
.chart-card{padding:20px 22px}
.chart-head{display:flex;align-items:center;margin-bottom:20px}
.chart-head h3{font-size:15.5px;font-weight:650;color:var(--ink-900)}
.chart-head .legend{margin-left:auto;display:flex;gap:16px;font-size:12px;color:var(--ink-400)}
.chart-head .legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:6px}
.donut-wrap{display:flex;align-items:center;gap:24px}
.donut-legend{flex:1;display:flex;flex-direction:column;gap:11px}
.donut-legend .row{display:flex;align-items:center;gap:9px;font-size:12.5px}
.donut-legend .row i{width:9px;height:9px;border-radius:3px;flex:none}
.donut-legend .row b{margin-left:auto;font-weight:700;color:var(--ink-900);font-variant-numeric:tabular-nums}
.donut-legend .row span{color:var(--ink-500)}

/* ============================================================
   Screen: admin products
   ============================================================ */
.toolbar{display:flex;align-items:center;gap:11px;margin-bottom:18px}
.toolbar .spacer{flex:1}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:16px 4px 0;font-size:12.5px;color:var(--ink-400)}
.pager button{
  min-width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;
  font-size:12.5px;color:var(--ink-500);display:grid;place-items:center;padding:0 9px;
}
.pager button:hover{border-color:var(--brand-100);color:var(--brand-700);background:var(--brand-50)}
.pager button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.stock-bar{width:74px;height:6px;border-radius:var(--r-pill);background:#EDF1EE;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:8px}
.stock-bar .bar{height:100%;border-radius:var(--r-pill)}
.low{color:var(--danger);font-weight:600;font-size:12px}
.ok{color:var(--ink-500);font-size:12px}
</style>
</head>

      <div class="board-logo">🥬</div>
      <div>

</main>

          <td><span style="color:#F5A524">★</span> <b>5.0</b></td>
          <td><button class="btn btn-sm btn-ghost" style="padding:0 9px"><svg width="14" height="14"><use href="#i-edit"/></svg></button>
              <button class="btn btn-sm btn-ghost" style="padding:0 9px;color:var(--danger)"><svg width="14" height="14"><use href="#i-trash"/></svg></button></td>
        </tr>
        <tr>
          <td><div class="thumb g3">🥬</div></td>
          <td><b style="color:var(--ink-900);font-weight:600">高山娃娃菜 3 颗装</b></td>
          <td><span class="badge b-gray">生鲜果蔬</span></td>
          <td><b style="color:var(--accent-600)">¥9.90</b></td>
          <td class="muted" style="display:table-cell">¥15.90</td>
          <td><span class="stock-bar"><span class="bar" style="width:66%;background:var(--brand)"></span></span><span class="ok">33 件</span></td>
          <td><span style="color:#F5A524">★</span> <b>4.5</b></td>
          <td><button class="btn btn-sm btn-ghost" style="padding:0 9px"><svg width="14" height="14"><use href="#i-edit"/></svg></button>
              <button class="btn btn-sm btn-ghost" style="padding:0 9px;color:var(--danger)"><svg width="14" height="14"><use href="#i-trash"/></svg></button></td>

  <div class="pager">
    <span>共 16 条</span>
    <button>‹</button><button class="on">1</button><button>2</button><button>3</button><button>›</button>
  </div>
</template>

<script>
/* ============================================================
   Screen registry
   ============================================================ */
const SCREENS = [
  { id:'tokens',              name:'设计系统',    group:'基础',   role:'通用', desc:'色板 · 字阶 · 组件 · 圆角阴影，全部映射为可复用 token', url:'—', full:true },
  { id:'auth',                name:'登录 / 注册', group:'认证',   role:'通用', desc:'左右分栏：左侧品牌叙事 + 右侧表单，注册支持用户 / 团长角色选择', url:'localhost:5173/login', full:true },
  { id:'user-home',           name:'团购广场',    group:'用户端', role:'USER', desc:'Hero 引导 + 筛选 chips + 团购卡片；进度条与倒计时是核心视觉锚点', url:'localhost:5173/user/groups', nav:'home' },
  { id:'user-products',       name:'商品浏览',    group:'用户端', role:'USER', desc:'左侧分类与价格筛选，右侧商品网格，评分前置', url:'localhost:5173/user/products', nav:'grid' },
  { id:'user-product-detail', name:'商品详情',    group:'用户端', role:'USER', desc:'大图 + 拼团价条 + 团购进度 + 评价 + 关联团购', url:'localhost:5173/user/products/1', nav:'grid' },
  { id:'user-orders',         name:'我的订单',    group:'用户端', role:'USER', desc:'状态 Tab + 订单卡片 + 取货码票据 + 状态时间轴', url:'localhost:5173/user/orders', nav:'receipt' },
  { id:'user-notifications',  name:'消息中心',    group:'用户端', role:'USER', desc:'按事件类型分组，未读高亮 + 圆点标识 + 一键已读', url:'localhost:5173/notifications', nav:'bell' },
  { id:'leader-groups',       name:'我的团购',    group:'团长端', role:'LEADER', desc:'经营数据 + 团购列表（进度 / 差多少人 / 核销数）', url:'localhost:5173/leader/groups', nav:'box' },
  { id:'leader-verify',       name:'核销台',      group:'团长端', role:'LEADER', desc:'专注式大字号取货码输入 + 最近核销记录', url:'localhost:5173/leader/verify', nav:'qr' },
  { id:'admin-dashboard',     name:'数据看板',    group:'管理端', role:'ADMIN', desc:'KPI 卡 + 趋势折线 + 状态分布环形 + 最近订单', url:'localhost:5173/admin/dashboard', nav:'chart' },
  { id:'admin-products',      name:'商品管理',    group:'管理端', role:'ADMIN', desc:'搜索筛选 + 数据表格 + 库存可视化 + 行内操作', url:'localhost:5173/admin/products', nav:'box2' }
];

const NAV = {
  home:'i-home', grid:'i-grid', receipt:'i-receipt', bell:'i-bell',
  box:'i-box', box2:'i-box', qr:'i-qr', chart:'i-chart'
};

/* sidebar per role */
const MENU = {
  USER: [
    { g:'选购', items:[['团购广场','home'],['商品浏览','grid']] },
    { g:'我的', items:[['我的订单','receipt'],['消息中心','bell',6]] }
  ],
  LEADER: [
    { g:'经营', items:[['我的团购','box'],['核销台','qr']] },
    { g:'选购', items:[['团购广场','home'],['商品浏览','grid']] },
    { g:'我的', items:[['我的订单','receipt'],['消息中心','bell',6]] }
  ],
  ADMIN: [
    { g:'平台管理', items:[['数据看板','chart'],['商品管理','box2']] },
    { g:'我的', items:[['消息中心','bell',6]] }
  ]
};

const ROLE_LABEL = { USER:'用户', LEADER:'团长', ADMIN:'管理员' };
const ROLE_USER  = { USER:'user1', LEADER:'leader1', ADMIN:'admin' };

let current = 'tokens';

function buildSidebar(role){
  const menu = MENU[role] || MENU.USER;
  const navHtml = menu.map(grp=>`
    <div class="nav-grp">
      <label>${grp.g}</label>
      ${grp.items.map(([label,key,badge])=>`
        <button class="nav-item" data-nav="${key}">
          <svg><use href="#${NAV[key]}"/></svg>
          <span>${label}</span>
          ${badge?`<span class="n-badge">${badge}</span>`:''}
        </button>`).join('')}
    </div>`).join('');

  return `
  <div class="app">
    <aside class="app-side">
      <div class="side-logo">
        <div class="mark">🥬</div>
        <div><b>FreshCommunity</b><small>社区生鲜团购</small></div>
      </div>
      <nav class="side-nav">${navHtml}</nav>
      <div class="side-foot">
        <div class="side-user">
          <div class="avatar">${ROLE_USER[role][0].toUpperCase()}</div>
          <div style="flex:1;min-width:0">
            <b>${ROLE_USER[role]}</b>
            <small>${ROLE_LABEL[role]}</small>
          </div>
          <button class="icon-btn" style="width:30px;height:30px" title="退出登录"><svg width="16" height="16"><use href="#i-out"/></svg></button>
        </div>
      </div>
    </aside>
    <div class="app-main">
      <header class="app-top">
        <div class="crumb">FreshCommunity <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg> <b id="crumbTitle"></b></div>
        <div class="top-search"><svg width="16" height="16"><use href="#i-search"/></svg><span>搜索商品 / 团购 / 订单…</span></div>
        <button class="icon-btn"><svg width="19" height="19"><use href="#i-bell"/></svg><span class="dot-badge">6</span></button>
        <div class="avatar" style="width:36px;height:36px">${ROLE_USER[role][0].toUpperCase()}</div>
      </header>
      <div class="app-body" id="appBody"></div>
    </div>
  </div>`;
}

function render(id){
  current = id;
  const s = SCREENS.find(x=>x.id===id);
  const tpl = document.getElementById('tpl-'+id);
  const stage = document.getElementById('stage');
  stage.innerHTML = '';

  if (s.full){
    stage.appendChild(tpl.content.cloneNode(true));
  } else {
    const wrap = document.createElement('div');
    wrap.style.height = '100%';
    wrap.innerHTML = buildSidebar(s.role);
    stage.appendChild(wrap);
    const body = wrap.querySelector('#appBody');
    body.appendChild(tpl.content.cloneNode(true));
    wrap.querySelector('#crumbTitle').textContent = s.name;
    const active = wrap.querySelector(`.nav-item[data-nav="${s.nav}"]`);
    if (active) active.classList.add('on');
  }

  document.getElementById('stageTitle').textContent = s.name;
  document.getElementById('stageRole').textContent = s.role;
  document.getElementById('stageDesc').textContent = s.desc;
  document.getElementById('urlText').textContent = s.url;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.id===id));
  document.getElementById('stage').scrollTop = 0;
  history.replaceState(null,'','#'+id);
}

function buildTabs(){
  const groups = [];
  SCREENS.forEach(s=>{
    let g = groups.find(x=>x.name===s.group);
    if(!g){ g={name:s.group, items:[]}; groups.push(g); }
    g.items.push(s);
  });
  document.getElementById('tabs').innerHTML = groups.map(g=>`
    <div class="tab-grp">
      <span>${g.name}</span>
      ${g.items.map(s=>`<button class="tab" data-id="${s.id}">${s.name}</button>`).join('')}
    </div>`).join('');
  document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>render(b.dataset.id)));
}

buildTabs();
window.addEventListener('hashchange', ()=>{
  const id = location.hash.slice(1);
  if (id && SCREENS.some(s=>s.id===id) && id!==current) render(id);
});
const startId = location.hash.slice(1);
render(SCREENS.some(s=>s.id===startId) ? startId : 'tokens');
</script>
</body>
</html>
