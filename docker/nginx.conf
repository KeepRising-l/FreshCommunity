# FreshCommunity 前端 Nginx 配置：静态资源 + API 反代 + history 路由兜底
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端静态资源（构建产物带内容哈希，可长缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 种子素材图片（public/ 直出，同样长缓存）
    location /images/ {
        expires 7d;
    }

    # 后端 API 反代（SSE 流式响应需关闭缓冲）
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 后端静态托管的用户上传图片
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Vue Router history 模式：非文件路径全部回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
