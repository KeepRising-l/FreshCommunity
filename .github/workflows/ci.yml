# CI：push/PR 到 main 时跑后端集成测试（MySQL 服务容器）+ 前端测试与构建
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: "1234"
          MYSQL_DATABASE: freshcommunity_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -p1234"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run backend integration tests
        working-directory: backend
        env:
          DB_PASSWORD: "1234"
        run: mvn -B test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Unit tests (node:test)
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
